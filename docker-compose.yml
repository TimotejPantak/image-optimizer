version: '3.8'

services:
  app:
    build: .
    restart: always
    environment:
      - NODE_ENV=production
    # Port 3000 je prístupný len v rámci Docker siete pre Caddy

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config: