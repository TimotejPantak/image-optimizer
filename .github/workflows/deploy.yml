name: Deploy to DigitalOcean

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/image-optimizer
            git reset --hard origin/master
            git pull
            # NAJPRV ZMAŽEME STARÉ KONTAJNERY (tým obídeme tú Python chybu)
            docker-compose down
            # POTOM SPUSTÍME NOVÉ
            docker-compose up -d --build